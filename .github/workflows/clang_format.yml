name: Clang Format

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format
          curl -L https://raw.githubusercontent.com/llvm/llvm-project/release/18.x/clang/tools/clang-format/clang-format-diff.py -o /usr/local/bin/clang-format-diff
          chmod +x /usr/local/bin/clang-format-diff

      - name: Install reviewdog
        uses: reviewdog/action-setup@v1

      - name: Proof for reviewdog strip parameter
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff -U0 ${{ github.event.pull_request.base.sha }} > pr.diff
          echo "=== PR DIFF ==="
          cat pr.diff
          
          cat pr.diff | clang-format-diff -p1 > format.diff || true
          
          echo "=== FORMAT DIFF ==="
          cat format.diff
          
          echo "=== Running reviewdog with Default (-strip=1) ==="
          cat format.diff | reviewdog -f=diff -strip=1 -reporter=local -filter-mode=added || true
          
          echo "=== Running reviewdog with -strip=0 ==="
          cat format.diff | reviewdog -f=diff -strip=0 -reporter=local -filter-mode=added || true